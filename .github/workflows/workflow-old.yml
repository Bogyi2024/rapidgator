name: Rapidgator to HF Batch

# NOTE: every `github.event.inputs.*` below is what the frontend sends.
# Nothing about the input names / sources was changed - only how they are used.

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Source Type'
        required: false
        type: string
      rg_email:
        required: true
      rg_password:
        required: true
      rg_links:
        required: true
      hf_token:
        required: true
      repo_id:
        required: true
      repo_type:
        required: true
      worker_pool:
        required: false
        default: '[]'
      master_owner:
        required: false
      master_repo:
        required: false
      master_token:
        required: false
      # Tracks how many times this link bounced between workers
      fallback_attempt:
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  prepare_links:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      # No heredoc + no direct interpolation: links go through an env var, so
      # quotes / special characters can no longer break the shell script.
      - id: set-matrix
        env:
          RG_LINKS: ${{ github.event.inputs.rg_links }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RG_LINKS" \
            | sed -e 's/\r$//' -e '/^[[:space:]]*$/d' \
            | jq -R . | jq -s -c . > matrix.json

          COUNT=$(jq 'length' matrix.json)
          echo "Link count: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::rg_links is empty - nothing to transfer."
            exit 1
          fi
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  download_and_upload:
    needs: prepare_links
    runs-on: ubuntu-latest
    # GITHUB_TOKEN needs contents:write so it can fire repository_dispatch
    # (the fallback handoff path inside rpgx.py).
    permissions:
      contents: write
    timeout-minutes: 350
    strategy:
      # Was 20. Every parallel job logs into the same Rapidgator account from a
      # different IP, which is what gets the login endpoint to start dropping
      # connections. 5 is a safe default; raise it only if you see no blocks.
      max-parallel: 5
      fail-fast: false
      matrix:
        link: ${{ fromJson(needs.prepare_links.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          python -m pip install --upgrade pip
          # curl_cffi is the actual fix: python-requests' TLS fingerprint is
          # what rapidgator.net drops with "SSL: UNEXPECTED_EOF_WHILE_READING".
          python -m pip install --no-cache-dir requests huggingface-hub curl_cffi

      - name: Execute Transfer with Smart Watchdog
        timeout-minutes: 330
        env:
          # ---- frontend inputs, unchanged ----
          RG_EMAIL: ${{ github.event.inputs.rg_email }}
          RG_PASSWORD: ${{ github.event.inputs.rg_password }}
          RG_LINK: ${{ matrix.link }}
          HF_TOKEN: ${{ github.event.inputs.hf_token }}
          REPO_ID: ${{ github.event.inputs.repo_id }}
          REPO_TYPE: ${{ github.event.inputs.repo_type }}
          # Orchestrator variables passed to Python
          WORKER_POOL: ${{ github.event.inputs.worker_pool }}
          MASTER_OWNER: ${{ github.event.inputs.master_owner }}
          MASTER_REPO: ${{ github.event.inputs.master_repo }}
          MASTER_TOKEN: ${{ github.event.inputs.master_token }}
          FALLBACK_ATTEMPT: ${{ github.event.inputs.fallback_attempt }}
        run: |
          set +e

          # Stagger logins so parallel matrix jobs don't hit /user/login at once.
          DELAY=$(( ${{ strategy.job-index }} * 15 ))
          echo "⏳ Waiting $DELAY seconds to prevent login collision..."
          sleep $DELAY

          success=false
          max_retries=5
          attempt=1

          while [ "$success" = false ] && [ "$attempt" -le "$max_retries" ]; do
            echo "▶️ Attempt $attempt of $max_retries..."
            start_time=$(date +%s)

            python -u rpgx.py          # -u: unbuffered, keeps log order truthful
            exit_code=$?

            duration=$(( $(date +%s) - start_time ))
            echo "⏱️ Job duration: $duration seconds (Exit Code: $exit_code)"

            case "$exit_code" in
              0)
                # Guard against "exited 0 without doing anything".
                if [ "$duration" -lt 120 ]; then
                  echo "⚠️ ERROR: Finished too fast ($duration s)."
                else
                  echo "✅ SUCCESS: Job completed securely in $duration seconds."
                  success=true
                  break
                fi
                ;;
              42)
                # rpgx.py already delivered the handoff to Master.
                echo "✅ IP block detected, and the Master was notified."
                echo "This runner shuts down gracefully; the next worker takes the link."
                success=true
                break
                ;;
              2)
                # Deleted file / bad credentials / rejected HF token.
                echo "🛑 PERMANENT FAILURE: no point retrying here or handing off."
                exit 1
                ;;
              *)
                echo "⚠️ ERROR: Python script failed (exit $exit_code)."
                ;;
            esac

            if [ "$attempt" -lt "$max_retries" ]; then
              echo "🔄 Retrying in 20 seconds..."
              sleep 20
            fi
            attempt=$((attempt + 1))
          done

          if [ "$success" = false ]; then
            echo "❌ CRITICAL: Job failed after $max_retries attempts."
            exit 1
          fi
